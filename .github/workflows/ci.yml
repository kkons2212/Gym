name: Gym Management CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test (Python 3.10.11 & MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword@2026
          MYSQL_DATABASE: gym_management_db
          MYSQL_USER: gym_user
          MYSQL_PASSWORD: gym_password@2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          cache: "pip"

      - name: Install System Libraries (Headless PyQt6 & OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            xvfb \
            default-mysql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: "Quality Gate 1: Syntax & Critical Lint Check (flake8)"
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 UI --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: "Quality Gate 2: MySQL Schema DDL & Seed Data Migration"
        run: |
          mysql -h 127.0.0.1 -P 3306 -u gym_user -pgym_password@2026 gym_management_db < init_mysql.sql

      - name: "Quality Gate 3: Unit & Integration Tests (pytest)"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: gym_management_db
          DB_USER: gym_user
          DB_PASSWORD: gym_password@2026
        run: |
          if [ -d "UI/tests" ]; then
            pytest UI/tests -v
          else
            echo "UI/tests directory not found yet; skipping tests."
          fi

      - name: "Quality Gate 4: PyQt6 Headless Smoke Test"
        run: |
          xvfb-run -a python -c "
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          import sys
          from PyQt6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          print('PyQt6 Headless Application initialized successfully!')
          "

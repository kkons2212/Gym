services:
  mysql:
    image: mysql:8.0
    container_name: gym_mysql_server
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword@2026}
      MYSQL_DATABASE: ${DB_NAME:-gym_management_db}
      MYSQL_USER: ${DB_USER:-gym_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gym_password@2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - gym_mysql_data:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gym_mysql_data:
    driver: local
